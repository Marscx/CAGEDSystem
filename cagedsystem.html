<!doctype html>
<html lang="en">

<head>
	<title>CAGED</title>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- Grid CSS -->
	<link rel="stylesheet" type="text/css" href="style.css">
	<!-- Google Icons -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
	<svg>
		<!-- Akkordgrid -->
		<symbol id="guitarGrid">
			<line class="guitarGrid" x1="0" y1="4" x2="100" y2="4" />
			<line class="guitarGrid" x1="0" y1="12" x2="100" y2="12" />
			<line class="guitarGrid" x1="0" y1="20" x2="100" y2="20" />
			<line class="guitarGrid" x1="0" y1="28" x2="100" y2="28" />
			<line class="guitarGrid" x1="0" y1="36" x2="100" y2="36" />
			<line class="guitarGrid" x1="0" y1="44" x2="100" y2="44" />
			<!-- Abschlusslinie vor dem Sattel
            <line x1="1" y1="4" x2="1" y2="44" style="stroke:rgb(0,0,0);stroke-width:1" />
			-->
			<line x1="20" y1="4" x2="20" y2="44" style="stroke:rgb(0,0,0);stroke-width:2" />
			<line x1="40" class="guitarGrid" y1="4" x2="40" y2="44" />
			<line x1="60" class="guitarGrid" y1="4" x2="60" y2="44" />
			<line x1="80" class="guitarGrid" y1="4" x2="80" y2="44" />
		</symbol>
		<symbol id="guitarGrid2">
			<line class="guitarGrid" x1="0" y1="4" x2="260" y2="4" />
			<line class="guitarGrid" x1="0" y1="12" x2="260" y2="12" />
			<line class="guitarGrid" x1="0" y1="20" x2="260" y2="20" />
			<line class="guitarGrid" x1="0" y1="28" x2="260" y2="28" />
			<line class="guitarGrid" x1="0" y1="36" x2="260" y2="36" />
			<line class="guitarGrid" x1="0" y1="44" x2="260" y2="44" />
			<!-- Abschlusslinie vor dem Sattel
				<line x1="1" y1="4" x2="1" y2="44" style="stroke:rgb(0,0,0);stroke-width:1" />
				-->
			<line x1="20" y1="4" x2="20" y2="44" style="stroke:rgb(0,0,0);stroke-width:2" />
			<line x1="40" class="guitarGrid" y1="4" x2="40" y2="44" />
			<line x1="60" class="guitarGrid" y1="4" x2="60" y2="44" />
			<line x1="80" class="guitarGrid" y1="4" x2="80" y2="44" />
			<line x1="100" class="guitarGrid" y1="4" x2="100" y2="44" />
			<line x1="120" class="guitarGrid" y1="4" x2="120" y2="44" />
			<line x1="140" class="guitarGrid" y1="4" x2="140" y2="44" />
			<line x1="160" class="guitarGrid" y1="4" x2="160" y2="44" />
			<line x1="180" class="guitarGrid" y1="4" x2="180" y2="44" />
			<line x1="200" class="guitarGrid" y1="4" x2="200" y2="44" />
			<line x1="220" class="guitarGrid" y1="4" x2="220" y2="44" />
			<line x1="240" class="guitarGrid" y1="4" x2="240" y2="44" />

		</symbol>
		<!-- Chromtatische Punkte auf dem Griffbrett C Form -->
		<symbol id=cForm>
			<!--Saite 1-->
			<circle class="ChcircleSW" id="1e1" cx="14" cy="4" r="3" />
			<circle class="ChcircleSW" id="1f1" cx="34" cy="4" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="1fis1" cx="54" cy="4" r="3" />
			<circle class="ChcircleSW" id="1g1" cx="74" cy="4" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="1gis1" cx="94" cy="4" r="3" />
			<!--Saite 2-->
			<circle class="ChcircleSW" id="2b" cx="14" cy="12" r="3" />
			<circle class="ChcircleSW" id="2c1" cx="34" cy="12" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="2cis1" cx="54" cy="12" r="3" />
			<circle class="ChcircleSW" id="2d1" cx="74" cy="12" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="2dis1" cx="94" cy="12" r="3" />
			<!--Saite 3-->
			<circle class="ChcircleSW" id="3g" cx="14" cy="20" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="3gis" cx="34" cy="20" r="3" />
			<circle class="ChcircleSW" id="3a" cx="54" cy="20" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="3ais" cx="74" cy="20" r="3" />
			<!--Saite 4-->
			<circle class="ChcircleSW" id="4d" cx="14" cy="28" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="4dis" cx="34" cy="28" r="3" />
			<circle class="ChcircleSW" id="4e" cx="54" cy="28" r="3" />
			<circle class="ChcircleSW" id="4f" cx="74" cy="28" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="4fis" cx="94" cy="28" r="3" />
			<!--Saite 5-->
			<circle class="ChcircleSW" id="5A" cx="14" cy="36" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="5Ais" cx="34" cy="36" r="3" />
			<circle class="ChcircleSW" id="5B" cx="54" cy="36" r="3" />
			<circle class="ChcircleSW" id="5c" cx="74" cy="36" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="5cis" cx="94" cy="36" r="3" />
			<!--Saite 6-->
			<circle class="ChcircleSW" id="6E" cx="14" cy="44" r="3" />
			<circle class="ChcircleSW" id="6F" cx="34" cy="44" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="6Fis" cx="54" cy="44" r="3" />
			<circle class="ChcircleSW" id="6G" cx="74" cy="44" r="3" />
			<circle class="ChcircleSW unsichtbarWeiss" id="6Gis" cx="94" cy="44" r="3" />
		</symbol>
	</svg>
	<!-- Darstellung im CSS Grid System-->
	<div class="wrapper">
		<header class="header">CAGED Formen</header>
		<div class="panel">
			<h6>C Form</h6>
			<svg viewBox="-3 0 110 48">
				<use xlink:href="#guitarGrid" />
				<use xlink:href="#cForm" />
			</svg>
			<button class="buttonSlide" type="button" id="cSlide">
				1 Dur
			<span id="button__indicator" class="button__indicator"></span>
			</button>
			<ul class="pannellist pannellistHide" id="pannellistC" style="display: none;">
				<li>
					<button class="button" type="button" id="cDurAkk">Dur Akkord</button>
				</li>
				<li>
					<button class="button" type="button" id="cLeer">mit Leersaiten</button>
				</li>
				<li>
					<button class="button" type="button" id="cDurArp">Arpeggio</button>
				</li>
				<li>
					<button class="button" type="button" id="cDurPenta">Pentatonik</button>
				</li>
				<li>
					<button class="button" type="button" id="cDurIonisch">Ionisch</button>
				</li>
				<li>
					<button class="button" type="button" id="clearWhite">Weisse aus</button>
				</li>
				<li>
					<button class="button" type="button" id="Cclear">Clear!</button>
				</li>
			</ul>
			<button class="buttonSlide" type="button" id="g7Slide">
				5 Dur7
				<span id="button__indicator2" class="button__indicator"></span>
			</button>
			<ul class="pannellist pannellistHide" id="pannellistG" style="display: none;">
				<li>
					<button class="button" type="button" id="gDurAkk">Dur Akkord</button>
				</li>
				<li>
					<button class="button" type="button" id="gLeer">mit Leersaiten</button>
				</li>
				<li>
					<button class="button" type="button" id="gDurArp">Arpeggio</button>
				</li>
				<li>
					<button class="button" type="button" id="gDurPenta">Pentatonik</button>
				</li>
				<li>
					<button class="button" type="button" id="gDurMixo">7 einblenden</button>
				</li>
				<li>
					<button class="button" type="button" id="gclearWhite">Weisse aus</button>
				</li>
				<li>
					<button class="button" type="button" id="Gclear">Clear!</button>
				</li>
			</ul>
		</div>
		<footer class="footer">
			<p>marcscheidegger.ch</p>
		</footer>
	</div>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script src='myScript1.js'></script>
	<script src="myScript2.js"></script>
</body>

</html>
